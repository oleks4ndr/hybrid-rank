[project]
name = "hybrid-rank"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "rank-bm25", "numpy", "tqdm", "sentence-transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]