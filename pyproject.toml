[project]
name = "hybrid-rank"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "numpy", "tqdm", "sentence-transformers", "scipy", "huggingface_hub", "anthropic", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "rank-bm25"]  # rank-bm25: reference our BM25 is tested against

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]